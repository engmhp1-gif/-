<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />

  <!-- Shield Shape -->
  <path d="M 256,90 L 390,140 C 390,260 330,355 256,410 C 182,355 122,260 122,140 Z" 
        fill="url(#shieldGrad)" 
        stroke="#6ee7b7" 
        stroke-width="8" 
        filter="url(#glow)" />

  <!-- Internal Shield Border -->
  <path d="M 256,115 L 368,158 C 368,252 320,332 256,380 C 192,332 144,252 144,158 Z" 
        fill="#064e3b" 
        opacity="0.85" />

  <!-- Golden Lightning Bolt (Energy/Power Symbol) -->
  <polygon points="270,140 195,260 250,260 230,360 325,230 270,230" fill="url(#goldGrad)" filter="url(#glow)" stroke="#fef3c7" stroke-width="3" />

  <!-- Checkmark Badge on top -->
  <circle cx="340" cy="330" r="48" fill="#10b981" stroke="#ffffff" stroke-width="6" filter="url(#glow)" />
  <polyline points="320,330 334,344 362,316" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Arabic Typography Badge "155" -->
  <rect x="180" y="380" width="152" height="52" rx="26" fill="#0f172a" stroke="#fbbf24" stroke-width="4" filter="url(#glow)" />
  <text x="256" y="417" font-family="'Cairo', sans-serif" font-weight="900" font-size="28" fill="#fbbf24" text-anchor="middle">إجراء 155</text>
</svg>
