    <script>
      // Gracefully handle runtime environment constraint: "HMR: Disabled. Ignore WebSocket errors."
      window.addEventListener('error', function(event) {
        if (
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.message && (event.message.includes('WebSocket') || event.message.includes('createWebSocketModuleRunnerTransport')))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '') + String(event.reason && event.reason.stack || '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
